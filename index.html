<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badhon Editzx</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header class="nav">
  <div class="logo">BADHON EDITZX</div>
  <nav>
    <a>Home</a>
    <a>Videos</a>
    <a>Platforms</a>
    <a>About</a>
    <a>Contact</a>
  </nav>
  <button class="btn">Subscribe</button>
</header>

<section class="hero">
  <div class="ring"></div>
  <img src="logo.png" class="profile">

  <h1>BADHON EDITZX</h1>
  <p>EDITOR | CREATOR | INNOVATOR</p>

  <div class="icons">
    <i class="fab fa-youtube"></i>
    <i class="fab fa-telegram"></i>
    <i class="fab fa-instagram"></i>
    <i class="fab fa-x-twitter"></i>
    <i class="fab fa-tiktok"></i>
  </div>
</section>

<section class="platforms">
  <h2>MY PLATFORMS</h2>
  <div class="cards">
    <div class="card red">YouTube</div>
    <div class="card blue">Telegram</div>
    <div class="card pink">Instagram</div>
    <div class="card sky">Twitter</div>
    <div class="card green">TikTok</div>
  </div>
</section>

<section class="videos">
  <h2>LATEST VIDEOS</h2>
  <div class="grid">
    <img src="v1.jpg">
    <img src="v2.jpg">
    <img src="v3.jpg">
  </div>
</section>

<div class="player">
  <audio controls autoplay loop>
    <source src="music.mp3">
  </audio>
</div>

</body>
</html>
