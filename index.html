<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badhon Editzx</title>

<link rel="stylesheet" href="style.css">

<!-- ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">BADHON EDITZX</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Videos</a>
    <a href="#">Platforms</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
  <button class="subscribe">Subscribe</button>
</header>

<!-- HERO -->
<section class="hero">

  <div class="ring"></div>

  <!-- YOUR LOGO -->
  <img src="logo.png" class="profile">

  <h1>BADHON EDITZX</h1>
  <p>CRAFTING STORIES THAT INSPIRE</p>

  <!-- SOCIAL ICONS -->
  <div class="socials">
    <i class="fab fa-youtube"></i>
    <i class="fab fa-telegram"></i>
    <i class="fab fa-instagram"></i>
    <i class="fab fa-x-twitter"></i>
    <i class="fab fa-tiktok"></i>
  </div>

</section>

<!-- PLATFORMS -->
<section class="platforms">

  <h2>MY PLATFORMS</h2>

  <div class="cards">

    <div class="card yt">
      <i class="fab fa-youtube"></i>
      <p>YouTube</p>
    </div>

    <div class="card tg">
      <i class="fab fa-telegram"></i>
      <p>Telegram</p>
    </div>

    <div class="card ig">
      <i class="fab fa-instagram"></i>
      <p>Instagram</p>
    </div>

    <div class="card tw">
      <i class="fab fa-x-twitter"></i>
      <p>Twitter</p>
    </div>

    <div class="card tt">
      <i class="fab fa-tiktok"></i>
      <p>TikTok</p>
    </div>

  </div>

</section>

<!-- VIDEOS -->
<section class="videos">
  <h2>LATEST VIDEOS</h2>

  <div class="video-grid">
    <img src="v1.jpg">
    <img src="v2.jpg">
    <img src="v3.jpg">
  </div>
</section>

<!-- MUSIC PLAYER -->
<div class="music-player">
  <p>Now Playing: Edit Vibes</p>
  <audio controls autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>
</div>

</body>
</html>
